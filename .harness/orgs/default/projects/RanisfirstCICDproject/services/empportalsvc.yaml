service:
  name: emp-portal-svc
  identifier: empportalsvc
  orgIdentifier: default
  projectIdentifier: RanisfirstCICDproject
  serviceDefinition:
    spec:
      manifests:
        - manifest:
            identifier: k8s
            type: K8sManifest
            spec:
              store:
                type: Github
                spec:
                  connectorRef: Harnessgithubrepo
                  gitFetchType: Branch
                  paths:
                    - k8s
                  repoName: employee-portal
                  branch: main
              skipResourceVersioning: false
              enableDeclarativeRollback: false
      artifacts:
        primary:
          primaryArtifactRef: myDockerArtifact
          sources:
            - spec:
                connectorRef: DockerConnector
                imagePath: chaitrashree22/employee-portal-repo
                tag: <+pipeline.sequenceId>
                digest: ""
              identifier: myDockerArtifact
              type: DockerRegistry
    type: Kubernetes
